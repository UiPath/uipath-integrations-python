[project]
name = "uipath-codex-sdk"
version = "0.1.0"
description = "Python SDK that enables developers to build and deploy OpenAI Codex SDK agents to the UiPath Cloud Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai-codex>=0.161.0, <0.162.0",
    "aiohttp>=3.9.0",
    "aiosqlite>=0.19.0",
    "httpx>=0.27.0",
    "uipath>=2.14.41, <2.15.0",
    "uipath-platform>=0.2.34",
    "uipath-runtime>=0.13.0, <0.14.0",
    "uipath-llm-client[openai]>=1.17.1, <1.19.0",
]
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.entry-points."uipath.middlewares"]
register = "uipath_codex_sdk.middlewares:register_middleware"

[project.entry-points."uipath.runtime.factories"]
codex = "uipath_codex_sdk.runtime:register_runtime_factory"

[project.urls]
Homepage = "https://uipath.com"
Repository = "https://github.com/UiPath/uipath-integrations-python"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.14.1",
    "ruff>=0.9.4",
    "pytest>=7.4.0",
    "pytest-asyncio>=1.0.0",
]

[tool.mypy]
plugins = [
  "pydantic.mypy"
]
exclude = [
    "samples/.*",
    "template/.*"
]
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = false
check_untyped_defs = true

[tool.ruff]
line-length = 88
indent-width = 4
exclude = ["samples/**", "template/**"]

[tool.ruff.lint]
select = ["E", "F", "B", "I"]

[tool.ruff.lint.per-file-ignores]
"*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "contract: contract tests against the real bundled codex binary (local mocks, no network)",
]
