name: CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'packages/*/pyproject.toml'
      - '!packages/*/samples/**/pyproject.toml'
      - '!packages/*/testcases/**/pyproject.toml'

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-changed-packages:
    runs-on: uipath-ubuntu-latest
    outputs:
      packages: ${{ steps.detect.outputs.packages }}
      count: ${{ steps.detect.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'

      - name: Detect changed packages
        id: detect
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.after }}
        run: python .github/scripts/detect_changed_packages.py

  build:
    name: Build ${{ matrix.package }}
    needs: detect-changed-packages
    if: needs.detect-changed-packages.outputs.count > 0 && github.repository == 'UiPath/uipath-integrations-python'
    runs-on: uipath-ubuntu-latest
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect-changed-packages.outputs.packages) }}
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Setup uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version-file: "packages/${{ matrix.package }}/.python-version"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Build
        run: uv build --package ${{ matrix.package }}

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: release-dists-${{ matrix.package }}
          path: packages/${{ matrix.package }}/dist/

  pypi-publish:
    name: Upload ${{ matrix.package }} to PyPI
    needs: [detect-changed-packages, build]
    runs-on: uipath-ubuntu-latest
    environment: pypi
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect-changed-packages.outputs.packages) }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: release-dists-${{ matrix.package }}
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
