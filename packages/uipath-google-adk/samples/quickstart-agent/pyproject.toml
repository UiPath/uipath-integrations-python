[project]
name = "quickstart-agent"
version = "0.0.1"
description = "Quickstart Google ADK agent example"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "uipath-google-adk[anthropic]>=0.0.1, <0.1.0",
    "google-adk>=1.25.0",
    "uipath>=2.8.18, <2.9.0",
]

[dependency-groups]
dev = [
    "uipath-dev",
]

[tool.uv]
override-dependencies = ["opentelemetry-sdk>=1.39.0,<1.40.0"]

[tool.uv.sources]
uipath-dev = { path = "../../../../../uipath-dev-python", editable = true }
uipath-google-adk = { path = "../../", editable = true }
