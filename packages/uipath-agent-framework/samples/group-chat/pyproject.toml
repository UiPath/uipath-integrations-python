[project]
name = "group-chat"
version = "0.0.1"
description = "Group chat: multiple agents discuss a topic with an orchestrator picking speakers"
authors = [{ name = "John Doe" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "uipath>=2.14.41",
    "uipath-agent-framework>=0.1.2",
    "agent-framework-core>=1.0.0",
    "agent-framework-orchestrations>=1.0.0b260402",
]

[dependency-groups]
dev = [
    "uipath-dev",
]

[tool.uv]
prerelease = "allow"
