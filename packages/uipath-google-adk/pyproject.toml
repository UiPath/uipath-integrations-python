[project]
name = "uipath-google-adk"
version = "0.0.1"
description = "Python SDK that enables developers to build and deploy Google ADK agents to the UiPath Cloud Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.25.0",
    "openinference-instrumentation-google-adk>=0.1.0",
    "uipath>=2.8.18, <2.9.0",
    "uipath-runtime>=0.8.0, <0.9.0",
]
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
maintainers = [
    { name = "Cristian Pufu", email = "cristian.pufu@uipath.com" }
]

[project.entry-points."uipath.middlewares"]
register = "uipath_google_adk.middlewares:register_middleware"

[project.entry-points."uipath.runtime.factories"]
google-adk = "uipath_google_adk.runtime:register_runtime_factory"

[project.urls]
Homepage = "https://uipath.com"
Repository = "https://github.com/UiPath/uipath-integrations-python"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.14.1",
    "ruff>=0.9.4",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.1",
    "pre-commit>=4.1.0",
    "pytest-asyncio>=1.0.0",
]

[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "B", "I"]

[tool.ruff.lint.per-file-ignores]
"*" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
plugins = [
  "pydantic.mypy"
]
exclude = [
    "samples/.*",
    "testcases/.*"
]
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = false
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "google.adk.*"
ignore_missing_imports = true
ignore_errors = true

[[tool.mypy.overrides]]
module = "google.genai.*"
ignore_missing_imports = true
ignore_errors = true

[[tool.mypy.overrides]]
module = "openinference.*"
ignore_missing_imports = true
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra -q"
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"

[tool.uv]
# google-adk transitively depends on opentelemetry-exporter-gcp-logging which
# pins opentelemetry-sdk<1.39.0, but uipath-core requires >=1.39.0.
# google-adk itself allows opentelemetry-sdk>=1.36.0,<1.40.0 (since v1.24.0)
# so 1.39.x is compatible. Force the resolution with an override.
# https://github.com/google/adk-python/issues/4229
override-dependencies = [
    "opentelemetry-sdk>=1.39.0,<1.40.0",
]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
