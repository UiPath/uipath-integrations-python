readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "uipath>=2.14.41",
    "uipath-openai-agents>=0.1.2",
    "openai-agents>=0.6.5",
]

[dependency-groups]
dev = [
    "uipath-dev",
]
