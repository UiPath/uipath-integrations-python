[project]
name = "multi-agent"
version = "0.0.1"
description = "Google ADK multi-agent example with sub-agents and tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "uipath-google-adk",
    "google-adk>=1.25.0",
    "uipath>=2.8.18, <2.9.0",
]

[dependency-groups]
dev = [
    "uipath-dev",
]

[tool.uv]
override-dependencies = ["opentelemetry-sdk>=1.39.0,<1.40.0"]
