[project]
name = "typed-agent"
version = "0.0.1"
description = "Google ADK agent with strongly-typed input/output schemas"
authors = [{ name = "John Doe" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "uipath>=2.14.41",
    "uipath-google-adk>=0.1.1",
    "google-adk>=1.25.0",
]

[dependency-groups]
dev = [
    "uipath-dev",
]

[tool.uv]
override-dependencies = ["opentelemetry-sdk>=1.39.0,<1.40.0"]
