[project]
name = "concurrent"
version = "0.0.1"
description = "Concurrent: multiple agents analyze the same input in parallel"
authors = [{ name = "John Doe" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "uipath",
    "uipath-agent-framework",
    "agent-framework-core>=1.0.0rc1",
    "agent-framework-orchestrations>=1.0.0b260219",
]

[dependency-groups]
dev = [
    "uipath-dev",
]

[tool.uv]
prerelease = "allow"
