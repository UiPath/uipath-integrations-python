[project]
name = "quickstart-agent"
version = "0.0.1"
description = "Quickstart Google ADK agent example"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "uipath",
    "uipath-google-adk[anthropic]",
    "google-adk>=1.25.0",
]

[dependency-groups]
dev = [
    "uipath-dev",
]

[tool.uv]
override-dependencies = ["opentelemetry-sdk>=1.39.0,<1.40.0"]
