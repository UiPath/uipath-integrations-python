[project]
name = "uipath-agent-framework"
version = "0.1.0"
description = "Python SDK that enables developers to build and deploy Microsoft Agent Framework agents to the UiPath Cloud Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agent-framework-core>=1.0.0rc1",
    "agent-framework-orchestrations>=1.0.0b260219",
    "aiosqlite>=0.20.0",
    "openinference-instrumentation-agent-framework>=0.1.0",
    "uipath>=2.13.0, <2.14.0",
    "uipath-runtime>=0.12.1, <0.13.0",
]
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
maintainers = [
    { name = "Cristian Pufu", email = "cristian.pufu@uipath.com" }
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.43.0", "agent-framework-anthropic>=1.0.0b260219"]

[project.entry-points."uipath.middlewares"]
register = "uipath_agent_framework.middlewares:register_middleware"

[project.entry-points."uipath.runtime.factories"]
agent-framework = "uipath_agent_framework.runtime:register_runtime_factory"

[project.urls]
Homepage = "https://uipath.com"
Repository = "https://github.com/UiPath/uipath-integrations-python"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "ruff>=0.15.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "pre-commit>=4.5.1",
    "pytest-asyncio>=1.3.0",
]

[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "B", "I"]

[tool.ruff.lint.per-file-ignores]
"*" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
plugins = [
  "pydantic.mypy"
]
exclude = [
    "samples/.*",
    "testcases/.*"
]
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = false
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "agent_framework.*"
ignore_missing_imports = true
ignore_errors = true

[[tool.mypy.overrides]]
module = "openinference.*"
ignore_missing_imports = true
ignore_errors = true

[[tool.mypy.overrides]]
module = "aiosqlite.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["anthropic", "anthropic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "agent_framework_anthropic.*"
ignore_missing_imports = true
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra -q --cov=src/uipath_agent_framework --cov-report=term-missing"
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"

[tool.uv]
exclude-newer = "2 days"
prerelease = "allow"

[tool.uv.exclude-newer-package]
uipath = false
uipath-core = false
uipath-platform = false
uipath-runtime = false

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.coverage.run]
source = ["src/uipath_agent_framework"]
relative_files = true
omit = [
  "*/tests/*",
  "*/__pycache__/*",
  "*/site-packages/*",
  "*/conftest.py",
]

[tool.coverage.report]
show_missing = true
precision = 2
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "@(abc\\.)?abstractmethod",
]
